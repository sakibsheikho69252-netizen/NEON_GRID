<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="1" stop-color="#0c1428"/>
    </linearGradient>
    <linearGradient id="cy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ee6ff"/>
      <stop offset="1" stop-color="#2f7fff"/>
    </linearGradient>
    <linearGradient id="mg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4fd8"/>
      <stop offset="1" stop-color="#a02fff"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="96" fill="none" stroke="#1a2f52" stroke-width="2"/>

  <g filter="url(#glow)" stroke="url(#cy)" stroke-width="14"
     stroke-linecap="round" fill="none" opacity="0.95">
    <path d="M128 128 H384 M128 256 H384 M128 384 H384"/>
    <path d="M128 128 V384 M256 128 V384 M384 128 V384"/>
  </g>

  <circle cx="128" cy="256" r="34" fill="url(#mg)" filter="url(#glow)"/>
  <circle cx="128" cy="256" r="58" fill="none" stroke="#ff4fd8" stroke-width="7" opacity="0.45"/>

  <circle cx="384" cy="128" r="26" fill="none" stroke="#3dff9e" stroke-width="12" filter="url(#glow)"/>
  <circle cx="384" cy="384" r="26" fill="none" stroke="#3dff9e" stroke-width="12" filter="url(#glow)"/>
</svg>
