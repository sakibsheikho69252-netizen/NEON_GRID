    <text x="340" y="1076" text-anchor="middle" font-family="system-ui,sans-serif"
          font-size="46" font-weight="800" fill="#eafcff">0:31</text>
    <text x="340" y="1116" text-anchor="middle" font-family="system-ui,sans-serif"
