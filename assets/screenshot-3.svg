    <text x="740" y="1076" text-anchor="middle" font-family="system-ui,sans-serif"
          font-size="46" font-weight="800" fill="#eafcff">18</text>
    <text x="740" y="1116" text-anchor="middle" font-family="system-ui,sans-serif"
