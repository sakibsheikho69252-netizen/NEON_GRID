  <text x="540" y="612" text-anchor="middle" font-family="system-ui,sans-serif"
        font-size="24" font-weight="700" letter-spacing="7" fill="#8ba3c8">LEVEL 24</text>

  <g filter="url(#glow)" fill="url(#gold)">
