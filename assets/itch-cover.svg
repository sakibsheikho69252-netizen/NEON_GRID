<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 500" width="630" height="500">
  <defs>
    <radialGradient id="bg" cx="0.15" cy="0" r="1.2">
      <stop offset="0" stop-color="#12305e"/>
      <stop offset="0.55" stop-color="#070b16"/>
      <stop offset="1" stop-color="#05070f"/>
    </radialGradient>
    <linearGradient id="t1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaffff"/>
      <stop offset="0.5" stop-color="#2ee6ff"/>
      <stop offset="1" stop-color="#2f7fff"/>
    </linearGradient>
    <linearGradient id="t2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe8ff"/>
      <stop offset="0.5" stop-color="#ff4fd8"/>
      <stop offset="1" stop-color="#a02fff"/>
    </linearGradient>
    <linearGradient id="cy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ee6ff"/>
      <stop offset="1" stop-color="#2f7fff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 H0 V32" fill="none" stroke="#3c8cdc" stroke-width="0.8" opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="630" height="500" fill="url(#bg)"/>
  <rect width="630" height="500" fill="url(#grid)"/>

  <g transform="translate(378 92)" filter="url(#glow)">
    <rect x="0" y="0" width="216" height="216" rx="20"
          fill="rgba(10,17,33,0.85)" stroke="rgba(70,150,220,0.35)" stroke-width="2"/>
    <g stroke="url(#cy)" stroke-width="9" stroke-linecap="round" fill="none">
      <path d="M24 60 H192"/>
      <path d="M192 60 V108"/>
      <path d="M192 108 H24"/>
      <path d="M24 108 V156"/>
      <path d="M24 156 H192"/>
    </g>
    <circle cx="24" cy="60" r="16" fill="#ff4fd8"/>
    <circle cx="192" cy="156" r="13" fill="none" stroke="#3dff9e" stroke-width="7"/>
  </g>

  <text x="44" y="200" font-family="system-ui,-apple-system,sans-serif"
        font-size="68" font-weight="900" letter-spacing="4" fill="url(#t1)">NEON</text>
  <text x="44" y="268" font-family="system-ui,-apple-system,sans-serif"
        font-size="68" font-weight="900" letter-spacing="4" fill="url(#t2)">GRID</text>

  <text x="46" y="312" font-family="system-ui,sans-serif"
        font-size="15" font-weight="600" letter-spacing="4" fill="#8ba3c8">
    CONNECT THE CIRCUIT
  </text>

  <text x="46" y="368" font-family="system-ui,sans-serif"
        font-size="13" font-weight="700" letter-spacing="2" fill="#2ee6ff">
    100 LEVELS · DAILY PUZZLES
  </text>
  <text x="46" y="392" font-family="system-ui,sans-serif"
        font-size="13" font-weight="700" letter-spacing="2" fill="#3dff9e">
    OFFLINE · NO INSTALL
  </text>

  <text x="46" y="446" font-family="system-ui,sans-serif"
        font-size="11" font-weight="700" letter-spacing="3" fill="#ff4fd8">
    FREE HTML5 PUZZLE
  </text>
</svg>
